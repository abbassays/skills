name: Vercel Deploy Trigger

# Single-project repo: ONE Vercel project connected to the repo root.
# Fires on every push to every branch, or on demand (Actions UI / `gh` / the
# redeploy script). The real logic lives in the reusable workflow.
#
# Rename this file to vercel-deploy-trigger.yml when you drop it in
# .github/workflows/ (scripts/redeploy.sh dispatches that exact name).
on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to (re)deploy. Defaults to the branch this run was dispatched on.
        type: string
        required: false

permissions:
  contents: write

jobs:
  trigger:
    # Manual dispatch always runs. Pushes run unless it's a branch/tag deletion
    # or the deploy-trigger commit itself (skip avoids a needless extra run).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.head_commit != null &&
       !contains(github.event.head_commit.message, '[skip-deploy-trigger]'))
    uses: ./.github/workflows/vercel-deploy-trigger.reusable.yml
    with:
      ref: ${{ inputs.ref || github.ref_name }}
    secrets: inherit
