name: Vercel Deploy Trigger (reusable)

# Reusable workflow — the shared engine behind both the single-project and the
# monorepo callers. Do NOT edit per-repo config here; edit the caller.
#
# Problem: on the Vercel free ("Hobby") plan a project only builds commits whose
# author is the personal account connected to the project. In CI you can't
# reliably tell who that is from the GitHub context (in an org repo
# github.repository_owner is the org, not a person) — so we ask Vercel directly
# with an API token.
#
# Two identities are at play:
#   * VERIFY — the Vercel token resolves the connected owner's email
#              (GET /v2/user), so we know whose commits Vercel will build.
#   * BUILD  — Vercel does NOT block commits authored by Claude, so the dummy
#              commit is authored as `Claude <noreply@anthropic.com>`; that is
#              what actually slips the deployment past the free-plan limit.
#
# So: if HEAD's author is NOT the connected owner (and isn't already a Claude
# commit), we add ONE tiny commit by Claude that rewrites each trigger file.
#
# MONOREPO NOTE: Vercel skips a project's build when nothing under its Root
# Directory changed. To force a specific app to rebuild, its trigger file must
# live INSIDE that app's root dir (e.g. apps/web/.vercel-deploy-trigger). Pass
# one path per target app via `trigger-files`; all are written in a SINGLE
# commit so the apps rebuild together with no push race and no trigger loop.
#
# Config in the calling repo (Settings -> Secrets and variables -> Actions):
#   - secret VERCEL_TOKEN (required; token owned by the connected Vercel account)

on:
  workflow_call:
    inputs:
      ref:
        description: Branch to inspect and (if needed) push the dummy commit to.
        type: string
        required: true
      trigger-files:
        description: |
          Newline-separated list of single-line files to rewrite in place to
          produce the dummy commit. One per app for a monorepo; the default is
          a single repo-root file for a single-project repo.
        type: string
        default: .vercel-deploy-trigger
    secrets:
      VERCEL_TOKEN:
        description: Vercel API token owned by the connected account (used to verify the owner).
        required: true

permissions:
  contents: write

# Claude is the identity Vercel builds for. A commit already authored by Claude
# needs no nudge (this also prevents loops).
env:
  CLAUDE_EMAIL: noreply@anthropic.com
  CLAUDE_NAME: Claude

# Serialize per-branch so concurrent runs can't race on the trigger files / push.
concurrency:
  group: vercel-deploy-trigger-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Verify the connected owner via Vercel
        id: owner
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          resp="$(curl -fsS -H "Authorization: Bearer ${VERCEL_TOKEN}" "https://api.vercel.com/v2/user")"
          email="$(printf '%s' "$resp" | jq -r '.user.email // empty')"
          if [ -z "$email" ]; then
            echo "::error::Could not resolve the owner email from Vercel. Is VERCEL_TOKEN valid?"
            exit 1
          fi
          echo "::add-mask::$email"
          echo "email=$email" >> "$GITHUB_OUTPUT"

      - name: Decide whether a Claude dummy commit is needed
        id: decide
        env:
          OWNER_EMAIL: ${{ steps.owner.outputs.email }}
        run: |
          set -euo pipefail
          commit_email="$(git log -1 --pretty=format:'%ae' | tr '[:upper:]' '[:lower:]')"
          owner_email="$(printf '%s' "$OWNER_EMAIL" | tr '[:upper:]' '[:lower:]')"

          if [ "$commit_email" = "$CLAUDE_EMAIL" ]; then
            echo "HEAD is already a Claude commit; Vercel will build it. Nothing to do."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          elif [ "$commit_email" = "$owner_email" ]; then
            echo "HEAD is by the connected owner; Vercel will build it. Nothing to do."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "HEAD ($commit_email) is not the owner; a Claude dummy commit is needed."
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Claude pushes the dummy trigger commit
        if: steps.decide.outputs.needed == 'true'
        env:
          TRIGGER_FILES: ${{ inputs.trigger-files }}
        run: |
          set -euo pipefail
          # Authored SOLELY as Claude — no real email. Vercel does not block
          # Claude commits; adding any real co-author email gets it BLOCKED.
          git config user.name  "$CLAUDE_NAME"
          git config user.email "$CLAUDE_EMAIL"

          head="$(git rev-parse HEAD)"
          run="${{ github.run_id }}"

          # Rewrite the single line in each target file (creating the app dir if
          # it somehow lacks one) — the diff is always one line per file.
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            mkdir -p "$(dirname "$f")"
            printf 'deploy-trigger: %s %s\n' "$head" "$run" > "$f"
            git add "$f"
          done <<< "$TRIGGER_FILES"

          git commit -m "chore: trigger vercel deploy [skip-deploy-trigger]"
          git push origin "HEAD:${{ inputs.ref }}"
